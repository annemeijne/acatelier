<!DOCTYPE html>
<html lang="nl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO -->
  <title>Creatie | ACA — Annemeijne's Creatieve Atelier</title>

  <meta
    id="page-description"
    name="description"
    content="Unieke handgemaakte creatie van ACA."
  >

  <link
    id="canonical-url"
    rel="canonical"
    href=""
  >

  <!-- Social media / delen -->
  <meta property="og:type" content="product">

  <meta
    id="og-title"
    property="og:title"
    content="Creatie | ACA"
  >

  <meta
    id="og-description"
    property="og:description"
    content="Unieke handgemaakte creatie van ACA."
  >

  <meta
    id="og-url"
    property="og:url"
    content=""
  >

  <meta
    id="og-image"
    property="og:image"
    content=""
  >

  <meta name="twitter:card" content="summary_large_image">

  <link rel="stylesheet" href="/style.css?v=19">

  <script src="/components.js" defer></script>
  <script src="/products.js" defer></script>
  <script src="/product.js" defer></script>
</head>

<body>

<div id="site-header"></div>


<main class="product-page">

  <nav
    class="product-breadcrumb"
    aria-label="Kruimelpad"
  >
    <a href="/creaties/">
      Creaties
    </a>

    <span aria-hidden="true">
      ·
    </span>

    <a
      id="breadcrumb-category"
      href="/creaties/kleding/"
    >
      Kleding
    </a>

    <span aria-hidden="true">
      ·
    </span>

    <span
      id="breadcrumb-product"
      aria-current="page"
    ></span>
  </nav>


  <section class="product-hero">

    <div class="product-hero-image">

      <img
        id="product-main-image"
        src=""
        alt=""
        fetchpriority="high"
      >

    </div>


    <div class="product-summary">

      <p class="eyebrow">
        Uniek handgemaakt
      </p>

      <h1
        class="product-title"
        id="product-name"
      ></h1>

      <p
        class="product-lead"
        id="product-lead"
      ></p>


      <div class="product-meta">

        <div>

          <span class="meta-label">
            Prijs
          </span>

          <strong id="product-price">
          </strong>

        </div>


        <div>

          <span class="meta-label">
            Beschikbaarheid
          </span>

          <strong id="product-availability">
          </strong>

        </div>

      </div>


      <button
        class="button product-buy"
        type="button"
        disabled
      >
        Binnenkort te bestellen
      </button>


      <p class="product-note">
        ACA-creaties ontstaan zonder massaproductie en zijn niet bedoeld
        om exact opnieuw gemaakt te worden.
      </p>

    </div>

  </section>


  <section class="product-story">

    <div>

      <p class="eyebrow">
        Het verhaal
      </p>

      <h2
        class="section-title"
        id="product-story-title"
      ></h2>

    </div>


    <p id="product-story"></p>

  </section>


  <section class="product-details">

    <p class="eyebrow">
      Productdetails
    </p>

    <div
      class="product-details-grid"
      id="product-details"
    ></div>

  </section>


  <section
    class="product-gallery"
    id="product-gallery"
    aria-label="Productfoto's"
  ></section>


  <section class="product-back">

    <a
      class="button secondary"
      id="product-back"
      href="/creaties/kleding/"
    >
      ← Terug naar kleding
    </a>

  </section>

</main>


<div id="site-footer"></div>


<div
  class="lightbox"
  id="lightbox"
  role="dialog"
  aria-modal="true"
  aria-label="Vergrote productfoto"
  aria-hidden="true"
>

  <button
    class="lightbox-close"
    id="lightbox-close"
    type="button"
    aria-label="Sluiten"
  >
    ×
  </button>


  <button
    class="lightbox-prev"
    id="lightbox-prev"
    type="button"
    aria-label="Vorige foto"
  >
    ‹
  </button>


  <img
    id="lightbox-image"
    src=""
    alt=""
  >


  <button
    class="lightbox-next"
    id="lightbox-next"
    type="button"
    aria-label="Volgende foto"
  >
    ›
  </button>

</div>

</body>

</html>
