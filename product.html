<!DOCTYPE html>
<html lang="nl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title id="page-title">Product — ACA</title>
  <meta id="page-description" name="description" content="Handgemaakte creatie van ACA.">

  <link rel="stylesheet" href="/style.css">
</head>

<body>

<div id="site-header"></div>

<main class="product-page">

  <div class="product-breadcrumb">
    <a href="/creaties/">Creaties</a>
    <span>·</span>
    <a id="breadcrumb-category" href="#">Categorie</a>
    <span>·</span>
    <span id="breadcrumb-product">Product</span>
  </div>


  <section class="product-hero">

    <div class="product-hero-image">
      <img
        id="product-main-image"
        src=""
        alt=""
      >
    </div>


    <div class="product-summary">

      <p class="eyebrow">
        Uniek handgemaakt
      </p>

      <h1 class="product-title" id="product-name">
        Product
      </h1>

      <p class="product-lead" id="product-lead"></p>


      <div class="product-meta">

        <div>
          <span class="meta-label">Prijs</span>
          <strong id="product-price">Prijs volgt</strong>
        </div>

        <div>
          <span class="meta-label">Beschikbaarheid</span>
          <strong id="product-availability">Uniek exemplaar</strong>
        </div>

      </div>


      <button
        class="button product-buy"
        type="button"
        disabled
      >
        Binnenkort te bestellen
      </button>

      <p class="product-note">
        ACA-creaties ontstaan zonder massaproductie en zijn niet bedoeld
        om exact opnieuw gemaakt te worden.
      </p>

    </div>

  </section>


  <section class="product-story">

    <div>

      <p class="eyebrow">
        Het verhaal
      </p>

      <h2 class="section-title" id="product-story-title"></h2>

    </div>

    <p id="product-story"></p>

  </section>


  <section class="product-details">

    <p class="eyebrow">
      Productdetails
    </p>

    <div
      class="product-details-grid"
      id="product-details"
    ></div>

  </section>


  <section
    class="product-gallery"
    id="product-gallery"
  ></section>


  <section class="product-back">

    <a
      class="button secondary"
      id="product-back"
      href="/creaties/"
    >
      ← Terug naar creaties
    </a>

  </section>

</main>


<div id="site-footer"></div>


<div class="lightbox" id="lightbox" aria-hidden="true">

  <button
    class="lightbox-close"
    id="lightbox-close"
    aria-label="Sluiten"
  >
    ×
  </button>

  <button
    class="lightbox-prev"
    id="lightbox-prev"
    aria-label="Vorige foto"
  >
    ‹
  </button>

  <img
    id="lightbox-image"
    src=""
    alt="Vergrote productfoto"
  >

  <button
    class="lightbox-next"
    id="lightbox-next"
    aria-label="Volgende foto"
  >
    ›
  </button>

</div>


<script src="/components.js"></script>
<script src="/products.js"></script>
<script src="/product.js"></script>

</body>

</html>
